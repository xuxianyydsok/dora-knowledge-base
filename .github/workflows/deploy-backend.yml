name: Deploy Backend (Cloudflare Workers)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check required Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then echo "::error::缺少 GitHub Secret: $name"; missing=1; fi
          done
          [ "$missing" -eq 0 ]

      - name: Run deterministic backend tests
        run: npm run test:unit

      # wrangler-action 的 command 不支持 <<< herestring（2026-10-07 定位的部署失败根因：
      # 日志报 Unknown argument: <<<）。secret put 需要 stdin，改用裸 run 步骤 + printf 管道。
      - name: Sync Worker secrets
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # 仅在仓库配了对应 secret 时才同步：空值会把 Worker 上手工配置的密钥覆盖成空串。
        run: |
          if [ -n "${{ secrets.SUPABASE_URL }}" ]; then
            printf '%s' "${{ secrets.SUPABASE_URL }}" | npx wrangler secret put SUPABASE_URL
          else
            echo "skip SUPABASE_URL (not set in repo secrets, keep worker value)"
          fi
          if [ -n "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            printf '%s' "${{ secrets.SUPABASE_ANON_KEY }}" | npx wrangler secret put SUPABASE_ANON_KEY
          else
            echo "skip SUPABASE_ANON_KEY (not set)"
          fi
          if [ -n "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" ]; then
            printf '%s' "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY
          else
            echo "skip SUPABASE_SERVICE_ROLE_KEY (not set)"
          fi

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: backend
          command: deploy
