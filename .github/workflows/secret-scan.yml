name: Secret Scan

# 2026-10-08 起：凭据泄漏事故的预防闸门。
# 任何 push / PR 都会扫描工作树与全部提交历史，命中明文凭据即失败。

on:
  push:
  pull_request:

jobs:
  scan:
    name: 扫描明文凭据
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # --history 需要完整历史

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 扫描工作树
        run: node scripts/check-secrets.mjs

      - name: 扫描提交历史
        run: node scripts/check-secrets.mjs --history
