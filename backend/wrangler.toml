# Cloudflare Workers 配置
# 敏感变量（SUPABASE_*）通过 `wrangler secret put` 注入，禁止写入本文件
# 非敏感变量放在 [vars]

name = "knowledge-base-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# CORS 白名单（逗号分隔），Phase6 绑定自定义域名后更新为正式前端域名
CORS_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"

# R2 存储桶绑定（存放封面/插图，仅存路径字符串）
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "knowledge-base-assets"

# 自定义域名在 Phase6 部署阶段配置
# [[routes]]
# pattern = "api.example.com"
# custom_domain = true
