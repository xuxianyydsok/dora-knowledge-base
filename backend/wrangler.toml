# Cloudflare Workers 配置
# 敏感变量（SUPABASE_*）通过 `wrangler secret put` 注入，禁止写入本文件
# 非敏感变量放在 [vars]

name = "knowledge-base-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
# CORS 白名单（逗号分隔）：正式前端域名 + 本地开发地址
CORS_ORIGINS = "https://dora.xuguochen.de5.net,http://localhost:5173,http://127.0.0.1:5173"
# 访客模式：未登录也能只读浏览站长的内容（写操作仍需登录）。恢复强制登录改为 "false"
PUBLIC_MODE = "true"
GITHUB_STARS_USER = "xuxianyydsok"   # /github 页同步此账号的 GitHub Star

# 不使用 Cron（RSS 模块已移除，显式清空已有定时触发器）
[triggers]
crons = ["*/5 2-3 * * *"]   # GitHub Star 同步：每天 UTC 02:00–03:55（北京时间 10:00） 每 5 分钟一页（最多 24 页 = 2400 个）

# NewsNow 热榜服务（独立 Worker，源码 newsnext/newsnow，MIT），通过 service binding 内部调用
[[services]]
binding = "NEWSNOW"
service = "newsnow-api"

# R2 存储桶绑定（存放封面/插图，仅存路径字符串）
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "knowledge-base-assets"

# 自定义域名（Cloudflare 会自动创建 DNS 记录并签发证书）
[[routes]]
pattern = "api.xuguochen.de5.net"
custom_domain = true
