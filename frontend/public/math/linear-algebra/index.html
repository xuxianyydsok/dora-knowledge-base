      <h1>线性代数：把矩阵读成一个动作</h1>
      <p>线代的公式不多，难的是"同一个东西有七种说法"。这门课的关键是把每个代数式翻译成几何动作：
        矩阵乘法是空间的拉伸与旋转，行列式是面积（体积）的缩放倍数，特征向量是被踩住方向不变的那根轴。
        本页每章都配了可拖动、可改参数的图，先看图再读定义会轻松很多。</p>
